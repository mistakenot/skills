rules:
  - id: install-skills-from-local-compiled-path
    lifecycle: draft
    read_when: Installing or reinstalling this repo's skills into agents.
    value: 'Install from the local compiled output, not the remote repo: `npx skills install ./skills -s ''*'' -a claude-code codex -y` (or `make install`, which must wrap the local path). Installing from `mistakenot/skills` clones the remote and silently drops any compiled-but-unpushed skills. Avoid `--all` (it expands to every agent and copies into `./skills`); `-s ''*'' -a claude-code codex` targets only Claude Code (symlinked) and Codex.'
    why: Installing from the remote GitHub repo only sees what was pushed, so new local skills appear missing until committed — a confusing silent gap during development.
    sources:
      - 20260623T160816.998279Z-0001
      - 20260623T160816.998303Z-0002
      - 20260623T160816.998322Z-0006
    updated: "2026-06-23"
    predecessor_ids: []
    successor_ids: []
  - id: verify-cli-behavior-empirically-not-self-report
    lifecycle: draft
    read_when: Relying on a CLI's --help, check, or update output to decide how to call it or whether it succeeded.
    value: Don't trust a CLI's self-reporting. `npx skills check/update` reported "all up to date" while inspecting only 1 of 18 skills; `ntm --help` is ~54KB/truncated and lists flags that error in practice. Confirm behavior by running the real command against a live target and reading its actual output; drive critical actions explicitly (e.g. a generated install.sh) rather than trusting a status check.
    why: Self-reported help/status can be stale, truncated, or scoped to a subset, producing false confidence and silently wrong actions.
    sources:
      - 20260623T160816.998365Z-0019
      - 20260623T160816.998377Z-0022
      - 20260623T160816.998387Z-0025
    updated: "2026-06-23"
    predecessor_ids: []
    successor_ids: []
  - id: edit-skills-in-src-then-recompile
    lifecycle: draft
    read_when: Editing or adding a skill in this repo (SKILL.md, refs, or modules).
    value: '`src/` is the source of truth; compiled `skills/` and synced `.agents/`/`.claude/` copies are generated. Sources live at `src/<module>/skills/<name>/SKILL.md` (NOT `src/skills/<name>/` or `src/<name>/`; locate with `find src/ -path ''*<skill>*'' -name SKILL.md`). Adding a skill also requires registering it in `src/compile.py` (a `skill(...)` in a `module(...)` included in the final `compile([...])`). Edit src/, run `make compile`/`install`, and stage the source plus every regenerated copy together.'
    why: Editing compiled output is wasted (regenerated next compile), an unregistered skill never compiles, and one source edit surfaces as several changed files that must stay in sync.
    sources:
      - 20260623T160816.998328Z-0008
      - 20260623T160816.998368Z-0020
      - 20260623T160816.998372Z-0021
      - 20260623T160816.998397Z-0028
    updated: "2026-06-23"
    predecessor_ids: []
    successor_ids: []
  - id: use-python3-not-bare-python
    lifecycle: draft
    read_when: Running a Python script or command in this environment (scripts, Makefile targets).
    value: The bare `python` command is not installed (exit 127 / command not found); always use `python3`.
    why: Scripts and Makefile targets invoking `python` fail outright in this environment.
    sources:
      - 20260623T160816.998310Z-0003
    updated: "2026-06-23"
    predecessor_ids: []
    successor_ids: []
  - id: invoke-codex-cli-headless
    lifecycle: draft
    read_when: Shelling out to the Codex CLI from a skill or agent.
    value: Codex can't run interactively from inside Claude Code's Bash tool (no TTY -> "stdin is not a terminal"); use `codex exec` for non-interactive runs. `codex exec --full-auto` is deprecated -- use `codex exec --sandbox workspace-write`.
    why: Interactive Codex modes need a real terminal and the deprecated flag warns; skills must use the headless, current invocation.
    sources:
      - 20260623T160816.998349Z-0014
      - 20260623T160816.998384Z-0024
    updated: "2026-06-23"
    predecessor_ids: []
    successor_ids: []
  - id: claude-p-add-dir-is-variadic
    lifecycle: draft
    read_when: Shelling out to headless `claude -p` with `--add-dir`.
    value: '`--add-dir` is variadic and silently swallows the following positional prompt, causing "Input must be provided..." even when a prompt was passed. Order flags so the prompt comes last after `-p` (e.g. `claude --add-dir "$CWD" -p ... "/cmd ..."`).'
    why: The bug surfaces only at runtime, not at compile/lint time, so it ships unless the invocation order is correct.
    sources:
      - 20260623T160816.998381Z-0023
    updated: "2026-06-23"
    predecessor_ids: []
    successor_ids: []
  - id: safe-git-push-escalation-to-main
    lifecycle: draft
    read_when: A skill that pushes to main hits a rejected (non-fast-forward) push.
    value: 'Escalate safely: try `git pull --rebase` then push; if the rebase conflicts, `git rebase --abort`, try `git pull --no-rebase` then push; if that also fails, stop and ask. Never force-push and never discard changes.'
    why: User-enforced rule -- force-pushing or discarding to "fix" a rejected push risks destroying work on main.
    sources:
      - 20260623T160816.998338Z-0011
    updated: "2026-06-23"
    predecessor_ids: []
    successor_ids: []
  - id: gather-codebase-context-in-new-solution
    lifecycle: draft
    read_when: Deciding where the planning workflow gathers codebase/doc context.
    value: Gather codebase + docs context in new-solution, BEFORE writing the solution (write context.md after). Leave only history/past-task context for new-plan to merge into the existing context.md.
    why: User correction -- solutions designed without existing-pattern context don't fit the codebase and waste a review cycle.
    sources:
      - 20260623T160816.998342Z-0012
    updated: "2026-06-23"
    predecessor_ids: []
    successor_ids: []
  - id: prefer-runtime-tool-discovery-in-skills
    lifecycle: draft
    read_when: Writing a skill that needs a search or discovery tool.
    value: Instruct the agent to discover tools at runtime (e.g. run `auto search quickstart`) and pick the best fit, rather than hardcoding a specific command. Keeps skills portable across repos with different tooling.
    why: User preference -- hardcoded tool commands break in repos where that tooling isn't installed.
    sources:
      - 20260623T160816.998345Z-0013
    updated: "2026-06-23"
    predecessor_ids: []
    successor_ids: []
  - id: distil-simple-rules-first-defer-complex
    lifecycle: draft
    read_when: Distilling research findings into CLAUDE.md or standing guidance.
    value: Move only the simple, durable, actionable rules in first; split complex/tooling-heavy material (evals, optimizers, retrieval architecture) into a follow-up backlog and confirm the remainder back to the user.
    why: User correction -- dumping everything at once bloats standing guidance; staged extraction keeps it actionable.
    sources:
      - 20260623T160816.998352Z-0015
    updated: "2026-06-23"
    predecessor_ids: []
    successor_ids: []
  - id: surface-latent-assumptions-in-planning
    lifecycle: draft
    read_when: Running the planning workflow at requirements and solution stages.
    value: 'Two-part rule: (1) at requirements time, assume latent requirements exist in the user''s head and draw them out with interactive questions; (2) before presenting the solution, re-examine every design decision and double-check (AskUserQuestion) any not clearly dictated by requirements or established repo patterns. Decisions obvious from context need no confirmation.'
    why: User-enforced -- catches choices the user would only regret later when reviewing the implementation.
    sources:
      - 20260623T160816.998390Z-0026
    updated: "2026-06-23"
    predecessor_ids: []
    successor_ids: []
  - id: pre-commit-hook-behavior-in-skills-repo
    lifecycle: draft
    read_when: Committing changes in this repo when the pre-commit hook fails or restages files.
    value: 'The pre-commit hook compiles/lints and runs `auto skill sync`. It can (a) restage unrelated `.agents/`/`.claude/` churn -- unstage with `git reset HEAD .agents/ .claude/` to keep commits scoped; and (b) fail on PRE-EXISTING problems unrelated to your change (e.g. stale autodoc hashes). Clear the backlog first: `auto doc fix`, add title/summary/read_when frontmatter, `auto doc fixed <file>`, then retry. Never `--no-verify`.'
    why: The hook's side effects and pre-existing-state gating block otherwise-valid commits and pollute commit scope if not handled.
    sources:
      - 20260623T160816.998400Z-0029
      - 20260623T160816.998404Z-0030
    updated: "2026-06-23"
    predecessor_ids: []
    successor_ids: []
  - id: ntm-cli-quirks
    lifecycle: draft
    read_when: Using the ntm tmux-orchestration CLI.
    value: ntm `grep` uses Go RE2 regex, not POSIX -- POSIX escaped alternation (`a\|b`) silently matches nothing; use unescaped groups `(a|b)`. `--help` is ~54KB/truncated and lists nonexistent subcommands (no `ntm tail`/`extract`); real commands are `send`, `copy session:pane --last N`, `grep`, `watch`, `status --json`. `--robot-*`/JSON flags are session-scoped and error on `--help`.
    why: Failures are silent (empty results) or misleading (help lists flags that error), so wrong usage looks like a real empty answer.
    sources:
      - 20260623T160816.998362Z-0018
      - 20260623T160816.998377Z-0022
    updated: "2026-06-23"
    predecessor_ids: []
    successor_ids: []
  - id: match-skill-name-and-task-path-exactly
    lifecycle: draft
    read_when: Writing a skill that invokes another skill by name or builds a docs/tasks path.
    value: The invoked skill name must match exactly (`review-task`, not `review-task-docs`), and task folders follow `docs/tasks/<ID>-<NAME>/` -- resolve the real folder via a glob (`find docs/tasks -name "<ID>-*"`), don't assume `docs/tasks/<ID>`. A wrong path makes `rg`/`find` silently match zero files.
    why: Name/path mismatches fail silently (zero matches), so the skill appears to run but does nothing.
    sources:
      - 20260623T160816.998314Z-0004
    updated: "2026-06-23"
    predecessor_ids: []
    successor_ids: []
  - id: isolate-tmp-src-in-compiler-tests
    lifecycle: draft
    read_when: Writing a test that calls compile() or any generator with repo-root filesystem side effects.
    value: Use a nested `tmp_path/repo/src` layout. Pointing the test at the real `src/` makes the install-script generator clobber the repo's `install.sh`; the test still passes but corrupts the working tree.
    why: The corruption is invisible to the test (it passes) and was only caught by an independent cold PR reviewer.
    sources:
      - 20260623T160816.998407Z-0031
    updated: "2026-06-23"
    predecessor_ids: []
    successor_ids: []
  - id: run-cold-pr-review-before-merge
    lifecycle: draft
    read_when: Finishing an agent-executed task before merging.
    value: Run an independent cold reviewer (fresh context, no execution history) against the PR before merge. It catches real bugs the implementation subagents miss -- e.g. the install.sh clobber where tests passed but the tree was corrupted.
    why: Implementation subagents share context and blind spots; a cold reviewer is worth its cost.
    sources:
      - 20260623T160816.998410Z-0032
    updated: "2026-06-23"
    predecessor_ids: []
    successor_ids: []
  - id: codex-signals-no-issues-via-reaction
    lifecycle: draft
    read_when: Checking whether Codex has reviewed a PR or left feedback.
    value: When Codex finishes a review with no issues it leaves NO comment/thread -- `chatgpt-codex-connector[bot]` adds a thumbs-up reaction to the PR itself. Check PR reactions, not just unresolved threads, or you'll wrongly conclude it hasn't reviewed.
    why: Looking only at threads makes a clean Codex review look like "not reviewed yet."
    sources:
      - 20260623T160816.998394Z-0027
    updated: "2026-06-23"
    predecessor_ids: []
    successor_ids: []
  - id: emit-positive-marker-from-reviewers
    lifecycle: draft
    read_when: Building a skill that runs a reviewer and gates downstream steps on its output.
    value: A reviewer emitting zero comments is ambiguous between "clean pass" and "failed/no output." Have the reviewer always emit a positive success marker (e.g. a single "no issues found" note) and gate downstream resolve steps on it.
    why: Without a positive signal the caller can't distinguish a clean review from a broken one.
    sources:
      - 20260623T160816.998318Z-0005
    updated: "2026-06-23"
    predecessor_ids: []
    successor_ids: []
