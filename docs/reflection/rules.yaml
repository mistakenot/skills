rules:
  - id: smoke-test-cli-invoking-skills
    lifecycle: draft
    read_when: Authoring or editing a skill/script whose core action shells out to an external CLI (claude, codex, gh).
    value: Before declaring it done, run the real command end-to-end against a minimal fixture and verify the actual effect — compile and lint never catch flag-ordering or invocation bugs.
    why: Static checks validate structure and templating, not runtime behaviour; a broken invocation (e.g. a positional swallowed by a variadic flag like --add-dir) passes every gate up to execution.
    sources:
      - 20260624T093636.953853Z-0002
      - 20260624T093636.953811Z-0001
      - 20260624T093636.953942Z-0014
    updated: "2026-06-26"
    predecessor_ids: []
    successor_ids: []
  - id: surface-undeclared-design-decisions
    lifecycle: draft
    read_when: Turning a thin user prompt into a concrete spec or design (planning-workflow requirements/solution/plan).
    value: Enumerate every decision not dictated by requirements or established repo conventions and confirm each with the user before presenting docs, rather than silently picking a default.
    why: Silently-resolved assumptions are the dominant failure class — the user only discovers the wrong choice at code-review time, when it is expensive to undo.
    sources:
      - 20260624T093636.953879Z-0005
    updated: "2026-06-26"
    predecessor_ids: []
    successor_ids: []
  - id: isolate-side-effecting-runs
    lifecycle: draft
    read_when: Running or testing a file-writing skill or a function with filesystem side effects (e.g. compile()).
    value: Run it against a throwaway dir (temp path or git worktree), never the live repo, so cleanup is a reset rather than a judgment call about which side effects to keep.
    why: A green run can still corrupt the working tree (clobbered files, leftover scratch dirs or .gitignore entries); only side-effect isolation makes the run safe to repeat.
    sources:
      - 20260624T093636.953898Z-0009
      - 20260624T093636.953947Z-0015
    updated: "2026-06-26"
    predecessor_ids: []
    successor_ids: []
  - id: compile-and-commit-generated-output-atomically
    lifecycle: draft
    read_when: Editing source under src/ in a repo whose build fans it into tracked compiled output (skills/, mirrored references).
    value: Run the compile step immediately and stage the source plus every regenerated file in the same commit; never hand-edit or defer the generated tree.
    why: Deferring the build lets stale artifacts desynchronize from source and contaminate later unrelated commits.
    sources:
      - 20260624T093636.953905Z-0010
    updated: "2026-06-26"
    predecessor_ids: []
    successor_ids: []
  - id: commit-automation-must-push
    lifecycle: draft
    read_when: Authoring finalize/commit automation in a repo whose workflow pushes straight to main.
    value: End with an explicit push plus a conservative pull --rebase → merge → ask fallback; never stop at git commit and never force-push.
    why: A local commit is invisible to everyone until pushed — treating commit as the terminal step leaves the work unshared.
    sources:
      - 20260624T093636.953917Z-0011
    updated: "2026-06-26"
    predecessor_ids: []
    successor_ids: []
  - id: install-skills-from-local-path-not-repo-slug
    lifecycle: draft
    read_when: Running `npx skills install` (or `make install`) and expecting locally-built or unpushed skills to appear.
    value: Install from the local path (`./skills`), not a `<user>/<repo>` slug, unless you specifically want the pushed remote snapshot.
    why: A repo-slug source clones the remote default branch and ignores your working tree, so unpushed skills silently never install — yet the run still reports success.
    sources:
      - 20260624T093636.953927Z-0012
    updated: "2026-06-26"
    predecessor_ids: []
    successor_ids: []
  - id: use-python3-not-bare-python
    lifecycle: draft
    read_when: Running a Python script or Makefile target from bash in this repo.
    value: Invoke via the repo's make/uv target (or `python3`), never a bare `python`.
    why: No `python` shim is installed here — a bare `python` aborts with exit 127 even when a docstring says otherwise.
    sources:
      - 20260624T093636.953936Z-0013
    updated: "2026-06-26"
    predecessor_ids: []
    successor_ids: []
