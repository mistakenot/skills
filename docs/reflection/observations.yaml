  - id: 20260624T093636.953942Z-0014
    description: When one skill invokes another by literal name and builds its input path, that string is an unenforced contract that must be verified at both ends.
    context: Auditing a skill (request-codex-review) that shells out to another agent (Codex) to run a second skill (review-task) — one skill's command embeds an invocation of a different skill by name and constructs the target path itself.
    what_happened: >
      The caller invoked `$review-task-docs $TASK_ID` but the actual skill was named `review-task`, so Codex would
      fail to find it. It also passed a bare numeric `$TASK_ID` as a path where the real folder is
      `docs/tasks/$ID-$NAME/` (name suffix required). And a clean review with no comments was indistinguishable from a
      failed review that produced no output.
    root_cause: >
      The two skills were edited independently; the embedded invocation string and path assumption were never
      reconciled against the consumer skill's real name and the repo's `docs/tasks/$ID-$NAME/` folder convention.
      Nothing forced the contract to stay in sync.
    correct_approach: >
      Fix the invocation to the real skill name; resolve the full folder at runtime with
      `find "$CWD/docs/tasks" -maxdepth 1 -type d -name "${TASK_ID}-*"` and exit nonzero if not found; and have the
      reviewer emit an explicit "no issues found" marker so a clean review is positively distinguishable from a silent
      failure.
    key_insight: A literal skill name plus a constructed input path is an unenforced API contract — verify the exact name and the canonical path convention at both ends, and make "success with no output" produce an affirmative signal rather than silence.
