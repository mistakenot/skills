  - id: 20260624T093636.953927Z-0012
    description: "`npx skills install <repo-slug>` fetches the remote GitHub HEAD, so locally-added-but-unpushed skills silently never install."
    context: After scaffolding a new skill locally (compile.py emits it into ./skills/), then running `make install` / `npx skills install <user>/<repo>` and expecting it under .claude/skills and .agents/skills.
    what_happened: >
      User asked "why arent skills/generate-10-ideas/ and skills/revise-readme/ in .claude/skills?". `make install` ran
      `npx skills install mistakenot/skills -s '*' ...` and reported success, but `ls .claude/skills/` showed both new
      skills absent. compile had produced them locally; the install fetched from the remote repo where they had not
      been pushed yet. Installing from the local path (`npx skills install ./skills -s '*' ...`) fixed it (verified via
      --dry-run: "Local path validated", "Found 17 skills").
    root_cause: >
      A repo-slug source is resolved by the skills CLI to a git clone of the remote default branch — it does NOT read
      the local working tree, so unpushed local skills are invisible. The "success" message reflects the remote
      snapshot, masking the gap.
    correct_approach: >
      Install from the local path: `npx skills install ./skills -s '*' -a claude-code codex -y` (the Makefile install
      target was changed to use ./skills). Push first only if you specifically want the remote snapshot.
    key_insight: A package-manager source that looks like a repo slug means "fetch the remote," not "use my local checkout" — a green success message reflects what the remote had, not your uncommitted work.
