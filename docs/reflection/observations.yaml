  - id: 20260623T160816.998358Z-0017
    description: 'Compressing a skill/tool description while keeping routing-critical content actually improves activation rather than hurting it — removing background explanation of how the skill works internally sharpens the routing signal (SkillReducer: ~48% compression improved quality ~2.8%; well-optimized descriptions raised activation from ~20% to ~50%, and adding concrete usage examples raised it further from 72% to 90%). The description is a routing signal, not documentation; explain WHY in the SKILL.md body, not the description.'
    context: Use when writing or reviewing skill descriptions. Counterintuitive because the instinct is to add detail; the research shows the opposite. Grounded in EMNLP 2025 / Anthropic skill-authoring docs surfaced during the research session.
    git_commit: 931dd416acf2b06ae581d492262dbe72c7103b9e
