  - id: 20260623T160816.998355Z-0016
    description: 'The ~10-15 tool degradation threshold from tool-selection research does NOT translate directly to skills: tools load full JSON schemas every turn (~200-500+ tokens each), while skills use progressive disclosure (only name+description in the system prompt, ~50-150 tokens each, body loads on trigger). This gives skills a higher effective ceiling (~40-60 before flat presentation degrades), so cited tool-count limits must be re-derived for skills rather than applied verbatim.'
    context: Relevant when reasoning about how many skills a repo can carry before needing retrieval/routing, or when citing tool-selection papers as evidence for skill-catalog limits. The user pushed back twice asking the agent to be specific about the skill upper limit because the tool-based numbers were confusing.
    git_commit: 931dd416acf2b06ae581d492262dbe72c7103b9e
