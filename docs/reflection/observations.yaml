  - id: 20260624T093636.953889Z-0007
    description: Vite reads its config only at startup, so editing vite.config.ts under a long-running PM2 process has no effect until you restart it.
    context: Changing vite.config.ts (allowedHosts, plugins, /api middleware) for a Vite dev server kept always-on by PM2, when the change appears not to take effect (e.g. a host in allowedHosts is still blocked).
    what_happened: >
      The teach repo's CLAUDE.md documents the trap: "Vite reads its config only at startup, so config changes do not
      hot-reload in the long-running PM2 process. Run `npx pm2 restart teach-dev` to apply them — otherwise you'll
      keep hitting the stale config (this is how a host can be listed in allowedHosts yet still be blocked)."
    root_cause: >
      Vite parses its config file once at process boot; HMR only reloads app source, not config. Under a process
      manager the same process lives for days, so config edits never re-parse until an explicit restart.
    correct_approach: >
      After any vite.config.ts change run `npx pm2 restart teach-dev` (or restart whatever manages the server). Set
      BOTH server.allowedHosts (vite dev, 5173) and preview.allowedHosts (built PWA + /api preview, 4173), and point
      `tailscale serve` at whichever mode is actually serving.
    key_insight: Config files loaded once at process startup do not hot-reload — under a process manager, "I edited the config but nothing changed" almost always means the process needs restarting.
    git_commit: fb927ec6c95ec06ec08e84928654bc30f717eb30
    files:
      - /home/vscode/src/teach/CLAUDE.md
      - /home/vscode/src/teach/vite.config.ts
    session_ids: [9d74150a-a74f-46aa-b55b-e0e15d664528, a1916594e3f19c416]
