  - id: 20260624T093636.953953Z-0016
    description: "`autoskill lint` is unavailable in the worktree environment; rely on compiler validation for structural checks there."
    context: Verifying skills inside a git worktree (e.g. during task execution) where the normal `make lint` / `autoskill lint` step is expected.
    what_happened: >
      During task 002 execution, `autoskill lint` was not available in the worktree environment, so lint verification
      was skipped; compiler validation (`src/compile.py`) still caught all structural issues.
    root_cause: >
      The lint tool is not installed/available in every environment (notably worktrees), so a workflow that hard-depends
      on it as the only structural gate would be blocked.
    correct_approach: >
      Where `autoskill lint` is unavailable, fall back to the compiler's own validation as the structural gate (it
      catches structural/templating errors), and don't treat the missing linter as a blocker.
    key_insight: Don't assume every verification tool exists in every environment — know which checks overlap so a missing tool degrades gracefully to an available equivalent rather than blocking.
