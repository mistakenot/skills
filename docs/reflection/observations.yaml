  - id: 20260624T093636.953875Z-0004
    description: codex exec's --full-auto flag is deprecated in favour of --sandbox workspace-write.
    context: Invoking Codex non-interactively from a script or skill (e.g. request-codex-review).
    what_happened: >
      A run emitted a deprecation warning: codex exec now prefers `--sandbox workspace-write` over `--full-auto`. The
      skill was updated to replace `--full-auto` accordingly.
    root_cause: >
      The Codex CLI evolved its sandbox/permission surface; the older convenience flag still runs but is deprecated,
      and the skill had pinned the old flag.
    correct_approach: Use `codex exec --sandbox workspace-write` instead of `--full-auto` for autonomous Codex runs.
    key_insight: External CLI flags drift; deprecation warnings surfaced during runs are upstream signals to update pinned commands in skills.
    git_commit: fb927ec6c95ec06ec08e84928654bc30f717eb30
