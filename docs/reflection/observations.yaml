  - id: 20260623T160816.998349Z-0014
    description: 'The codex CLI cannot be launched from inside Claude Code''s Bash tool: interactive modes (e.g. `codex --search`) fail with ''Error: stdin is not a terminal'' because there is no TTY. Codex must be run from a real terminal, or invoked non-interactively via `codex exec` (as the request-codex-review skill does).'
    context: Relevant when a spawn/orchestration command pastes a raw interactive `codex ...` invocation into a Claude Code session, or when building skills that shell out to codex. Use `codex exec --full-auto` for headless/background review flows rather than the interactive entrypoint.
