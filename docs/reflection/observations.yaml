  - id: 20260623T160816.998314Z-0004
    description: 'When one skill invokes another agent/skill by name in a shell command (e.g. Codex review calling `$review-task`), the invoked name and any path conventions must exactly match reality. Two blocking bugs were found: the prompt called `$review-task-docs` but the skill is named `review-task`, and it built the task path as `docs/tasks/$TASK_ID` while the actual folder convention is `docs/tasks/$ID-$NAME/`, so `rg` silently matched zero files. Resolve the full folder via a glob (e.g. `find docs/tasks -name "${TASK_ID}-*"`) rather than assuming the bare ID is the directory.'
    context: Found while auditing the request-codex-review -> review-task handoff. Whenever a skill shells out to another skill by literal name or constructs a task-folder path, cross-check against the real skill name and the $ID-$NAME folder convention. Silent zero-match rg results are a symptom of the path bug.
    git_commit: 931dd416acf2b06ae581d492262dbe72c7103b9e
    files:
