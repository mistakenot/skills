  - id: 20260624T093636.953917Z-0011
    description: A commit-style skill that stops at git commit leaves work unpublished; commit automation should also push with a safe escalation ladder.
    context: Authoring or reviewing finalize/commit automation in a repo whose workflow pushes straight to main.
    what_happened: >
      User asked to "update the src for commit-task skill - after committing the changes, push up to origin before
      exiting. if this fails (because we're behind origin) try to safely merge / rebase ... if that fails, exit and ask
      for help." The original commit-task ended at `git commit` with no push, so committed planning docs never reached
      origin.
    root_cause: >
      The skill modeled "commit" as the terminal step, conflating a local commit with "the work is done/shared." In a
      push-to-main workflow the unpublished commit is invisible to everyone else.
    correct_approach: >
      End commit-style skills with an explicit push plus a safe escalation ladder: push; if rejected for being behind,
      `git pull --rebase` then push; if rebase conflicts, abort and try a non-rebase merge then push; if that fails,
      stop and ask the user — never force-push or discard changes.
    key_insight: Commit automation should publish, not just record — pair the commit with a push and a conservative rebase→merge→ask fallback, never an automatic force-push.
    git_commit: fb927ec6c95ec06ec08e84928654bc30f717eb30
    files: [src/planning-workflow/skills/commit-task/SKILL.md]
    session_ids: [ca273543-050a-4731-8de4-541d75c6774a]
    task_id: null
