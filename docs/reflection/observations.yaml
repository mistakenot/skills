    description: '`claude --add-dir <dir>` is variadic and will silently swallow the following positional prompt argument, causing ''Input must be provided either through stdin or as a prompt argument'' even though a prompt was passed. Fix by ordering flags so the prompt comes last after `-p` (e.g. `claude --add-dir "$CWD" -p --dangerously-skip-permissions "/review-task ..."`), not immediately after `--add-dir`.'
    context: Applies when invoking Claude Code headlessly (`claude -p`) with `--add-dir` to grant repo access, e.g. in a request-claude-review style skill that shells out to another Claude instance. The bug only surfaces at runtime, not at compile/lint time.
