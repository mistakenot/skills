  - id: 20260624T093636.953884Z-0006
    description: A PWA served from a Vite dev server has no offline support and re-fetches its JS on every load, so it breaks on any network blip.
    context: When a mobile/installed PWA is pointed at a long-running Vite dev server (e.g. exposed over `tailscale serve`) and the user reports "doesn't persist between reloads" / "forces a refresh that breaks with no network".
    what_happened: >
      User on mobile reported the app "does not persist progress between reloads" and "on opening, it forces a refresh
      which breaks it if there is no network... connecting to vite dev server over tailscale". Investigation found
      index.html loads `/src/entry.tsx` as a type=module script (re-fetched from the dev server every load), no service
      worker exists (the PWA manifest's `standalone` is cosmetic), and all session state is fetched live from the API
      each boot with nothing cached locally.
    root_cause: >
      A Vite dev server is online-first by design: it serves ES modules on demand with no precache, and a manifest
      alone does not make an app offline-capable — only a registered service worker does. State persistence was never
      wired because state lived only in server-fetched stores.
    correct_approach: >
      Serve a production build (`vite build` + `vite preview`) instead of the dev server, add vite-plugin-pwa with a
      workbox precache of the app shell (navigateFallback index.html, cleanupOutdatedCaches, clientsClaim) and
      stale-while-revalidate for API calls, persist app state locally with periodic push-back, and point
      `tailscale serve` at the preview port (4173), not the dev port (5173).
    key_insight: A web manifest declares installability; only a service worker plus a production build delivers offline. Never expect a Vite dev server to survive a flaky network — it re-fetches modules on every load.
    git_commit: fb927ec6c95ec06ec08e84928654bc30f717eb30
    files:
      - /home/vscode/src/teach/vite.config.ts
      - /home/vscode/src/teach/ecosystem.config.cjs
