  - id: 20260624T093636.953936Z-0013
    description: This environment has no bare `python` (only `python3`/`uv run`); `python src/compile.py` aborts with exit 127.
    context: Running the skill compiler or any Python script directly from bash in this repo, following a literal `python src/compile.py` from a docstring or older Makefile.
    what_happened: >
      `python src/compile.py` returned "Exit code 127 /bin/bash: line 1: python: command not found". Retrying with
      `python3 src/compile.py` worked. This recurred across two separate sessions.
    root_cause: >
      The environment ships only a `python3` binary with no `python` alias/symlink, yet documentation and the
      compiler's usage string said `python src/compile.py`.
    correct_approach: >
      Invoke `python3 src/compile.py`, or better run it via the Makefile target (`make compile`, which uses
      `uv run --no-dev python src/compile.py`) which avoids the bare-`python` trap. Don't trust the docstring's
      `python` form.
    key_insight: On modern systems `python` is often unaliased and only `python3` (or a managed runner like `uv run`) resolves — prefer the project's build target, which encodes the working invocation, over a hand-typed interpreter command.
