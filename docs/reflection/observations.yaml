observations:
  - id: 20260624T093636.953811Z-0001
    description: Claude Code's variadic --add-dir flag silently swallows a trailing positional prompt.
    context: Building a headless `claude -p` invocation that passes both --add-dir and a positional prompt (a review/eval harness or a skill that shells out to Claude Code).
    what_happened: >
      `claude -p --dangerously-skip-permissions --add-dir /tmp "echo test"` failed with
      "Error: Input must be provided either through stdin or as a prompt argument when using --print".
      Reordering to `claude --add-dir /tmp -p --dangerously-skip-permissions "echo test"` printed "test" correctly.
    root_cause: >
      --add-dir is variadic (accepts multiple directories), so a positional prompt directly following it is
      consumed as another directory argument, leaving --print with no prompt.
    correct_approach: >
      Never place a bare positional immediately after --add-dir. Put --add-dir first, then -p /
      --dangerously-skip-permissions, then the prompt last, or otherwise separate the variadic flag from the positional.
    key_insight: Variadic CLI flags greedily absorb the next positional argument; never place a bare positional immediately after one.
    git_commit: fb927ec6c95ec06ec08e84928654bc30f717eb30
    files: [src/planning-workflow/skills/request-claude-review/SKILL.md]
