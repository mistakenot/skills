  - id: 20260623T160816.998328Z-0008
    description: 'When building a new skill in this repo, registering it requires three coordinated edits, not just writing SKILL.md: create src/<module>/skills/<name>/SKILL.md, add a `module(...)`/`skill(...)` entry in src/compile.py and include the module in the final `compile([...])` call, then run `python src/compile.py`. Omitting the compile.py registration means the skill never compiles into ./skills/.'
    context: Applies when adding a brand-new skill (especially in a new module) to this skills repo. The compiler is a Python DSL in src/compile.py where modules and skills are declared explicitly and only the modules passed to compile([...]) at the bottom are built.
    git_commit: 931dd416acf2b06ae581d492262dbe72c7103b9e
