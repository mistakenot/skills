  - id: 20260624T093636.953853Z-0002
    description: A skill that shells out to an external CLI must be smoke-tested against the live binary, not just compiled and linted.
    context: Authoring or porting a skill whose core action is a shell command invoking an external tool (claude, codex, gh).
    what_happened: >
      request-claude-review compiled cleanly and passed `autoskill lint` and was committed as working. Only when the
      user said "test it works" and the agent actually ran the `claude --add-dir ... -p ...` command did the
      --add-dir argument-swallowing bug appear, requiring a follow-up fix commit.
    root_cause: >
      Compile and lint validate structure and templating, not runtime behaviour. Exact CLI flag ordering is invisible
      to static checks, so a broken invocation passed every gate up to execution.
    correct_approach: >
      Before declaring a CLI-invoking skill done, run its actual command end-to-end against a minimal fixture and
      verify the real effect (e.g. comments inserted in the expected format), not just that the binary exits 0.
    key_insight: Static checks never catch CLI argument-ordering bugs; only an end-to-end run against the live tool does.
    git_commit: fb927ec6c95ec06ec08e84928654bc30f717eb30
