  - id: 20260623T160816.998362Z-0018
    description: ntm grep uses Go (RE2) regex syntax, not POSIX. Alternation written POSIX-style with escaped pipes (e.g. 'a\|b\|c') silently returns 'No matches found'; the correct form is unescaped alternation inside a group, e.g. '(phase|Phase|PR |error)'. The failure is silent (no error), so a wrong-syntax pattern looks like a genuinely empty result.
    context: Applies when scripting ntm grep across tmux panes (e.g. in the executor-status-check / status-report skill, or any ad-hoc session scanning). The first attempt used escaped-pipe POSIX alternation and matched nothing even though the panes clearly contained the patterns; switching to Go-style '(a|b)' alternation immediately returned 17 matches across 3 panes.
    git_commit: 931dd416acf2b06ae581d492262dbe72c7103b9e
    files:
      - src/planning-workflow/skills/executor-status-check/SKILL.md
    session_ids:
