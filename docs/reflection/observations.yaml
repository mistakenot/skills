  - id: 20260623T160816.998322Z-0006
    description: 'The `make install` target installed skills from the remote GitHub repo (`npx skills install mistakenot/skills ...`) rather than the local compiled `./skills` directory. This silently dropped any newly-compiled-but-unpushed skills from `.claude/skills/`, since the remote clone only had what was already pushed. Fix: install from the local path (`npx skills install ./skills -s ''*'' -a claude-code codex -y`), which `npx skills` validates and accepts.'
    context: Applies when editing skills in this repo and expecting `make install` / `make compile` to propagate them to local agents (.claude/skills, .agents/skills). The compile step writes to ./skills/, but install must source from ./skills/ (not the remote repo) to pick up local-only changes before they are pushed.
    git_commit: 931dd416acf2b06ae581d492262dbe72c7103b9e
