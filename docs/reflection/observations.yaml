    description: When Codex finishes a PR review with no issues, it does not leave a comment or review thread — `chatgpt-codex-connector[bot]` adds a +1 (thumbs-up) reaction to the PR itself. An agent checking for feedback must look at PR reactions, not just unresolved threads, or it will wrongly conclude nothing has been reviewed yet.
    context: Applies to any workflow that waits on a Codex/automated PR review and then runs address-feedback. The first attempt to document this got it wrong (claimed the emoji was on the main PR comment); the user corrected it with evidence that it's a reaction on the PR from the connector bot.
