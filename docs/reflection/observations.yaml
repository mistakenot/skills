    description: '`ntm --help` output is ~54KB and gets truncated/persisted; many guessed subcommands don''t exist (no `ntm tail`, `ntm extract`). Useful real subcommands for reading/sending across panes: `ntm send` (with --smart/--pane/--json), `ntm copy session:pane --last N`, `ntm grep`, `ntm watch`, `ntm status --json`. Robot/JSON flags like `--robot-tail` are session-scoped and error with ''session not found'' when given `--help`.'
    context: Applies when scripting ntm (Named Tmux Manager) to read from or dispatch to other Claude Code panes — e.g. in delegate-task / executor-status-check skills. Probe specific subcommands with `ntm <cmd> --help` rather than guessing names.
