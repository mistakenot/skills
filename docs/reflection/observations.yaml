  - id: 20260623T160816.998390Z-0026
    description: 'The user enforces a two-part assumption-surfacing rule in the planning workflow: (1) at requirements time, assume there are latent requirements in the user''s head not stated in the prompt and proactively draw them out via interactive questions; (2) before presenting the solution doc, re-examine every design decision and double-check (via AskUserQuestion) any decision NOT clearly dictated by either the requirements or pre-established repo patterns. Decisions obvious from context/conventions need no confirmation. The goal is to catch choices the user would only regret later when reviewing the implementation.'
    context: 'Applies to planning-workflow skills new-task (Resolve Open Questions step) and new-solution (a Validate-assumptions step added just before the hard-stop). The distinguishing test for whether to ask: is the decision grounded in requirements OR an established codebase convention? If neither, ask.'
