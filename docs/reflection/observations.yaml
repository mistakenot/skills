  - id: 20260623T160816.998404Z-0030
    description: 'Adding a compile/lint step to the pre-commit hook causes commits to fail on PRE-EXISTING problems unrelated to the change — here, stale autodoc hashes blocked the commit. The fix is to clear the backlog first: run `autodoc fix` to see what''s stale, update title/summary/read_when frontmatter, then `autodoc fixed <file>` to refresh each hash before retrying the commit.'
    context: Applies when a pre-commit hook bundles repo-wide validation (autodoc stale, lint) and a focused commit trips over latent issues. autodoc fix only prints instructions and exits 1; the hash is actually refreshed by `autodoc fixed <path>`.
    git_commit: 931dd416acf2b06ae581d492262dbe72c7103b9e
