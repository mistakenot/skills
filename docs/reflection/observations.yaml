  - id: 20260623T160816.998335Z-0010
    description: Vite's `server.allowedHosts` only covers `vite dev`; `vite preview` (the built-PWA + /api serving mode) uses its own `preview.allowedHosts`, and the two default to different ports (dev 5173, preview 4173). When switching a Tailscale-served app from dev to a production preview, you must set both allowedHosts lists and re-point `tailscale serve` at the preview port.
    context: Relevant whenever moving a Tailscale-exposed Vite app from dev-server to production-preview serving, or debugging why a tailnet host is rejected despite being listed. Documented in the teach repo's CLAUDE.md.
    git_commit: 931dd416acf2b06ae581d492262dbe72c7103b9e
