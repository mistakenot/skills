  - id: 20260623T160816.998342Z-0012
    description: 'Gathering codebase context only in the new-plan stage (after the solution is designed) causes backtracking: solutions designed in a vacuum don''t fit existing patterns and waste a review cycle. The user moved code+docs context gathering into new-solution (run BEFORE writing the solution, write context.md after), leaving only history/past-task context (CB3) in new-plan to merge into the existing context.md.'
    context: 'Relevant when designing the ordering of a multi-stage plan→solution→execute workflow, or arguing where context-gathering subagents belong. The reasoning: anchoring risk is real but smaller than the cost of designing against a codebase you haven''t scouted; experienced engineers scout before proposing an approach.'
