      - {kind: session_message, ref: a633cdef650f8d31a-13}
  - id: 20260624T093636.953905Z-0010
    description: In a src/->compiled repo, editing source without immediately recompiling and committing the whole generated tree leaves stale output that contaminates later commits.
    context: Adding or editing a skill or a shared reference under src/ in a repo whose build (src/compile.py) fans source into many tracked compiled copies (skills/, .agents/skills/, per-skill references/).
    what_happened: >
      After adding request-codex-review and editing the shared workflow-overview.md, `git status` showed not just the
      two source files but 13 modified `skills/*/references/workflow-overview.md` copies plus the new compiled tree;
      they had to be regenerated (`python3 src/compile.py` → "Compiled 14 skills") and staged with the source. In a
      separate session, a `/rename` commit swept up stale compiled artifacts from earlier source edits whose output was
      never committed ("Also includes compiled output for recent source changes...").
    root_cause: >
      The build fans a single source file out into N tracked copies and the repo commits compiled output; treating
      compile as optional/deferred lets the generated tree desynchronize from source across commits.
    correct_approach: >
      Make compile+stage+commit atomic with the source edit: run the compile step immediately after editing src/,
      `git add` both the source and every regenerated mirror tree in one commit, and rely on a pre-commit `make check`
      (compile + lint) to prevent drift. Never hand-edit the compiled tree.
    key_insight: When generated artifacts are checked into the repo, source and output must move in the same commit — deferring the build lets stale artifacts accumulate and contaminate later unrelated commits.
    git_commit: fb927ec6c95ec06ec08e84928654bc30f717eb30
    files: [src/compile.py, Makefile, src/planning-workflow/refs/workflow-overview.md]
