  - id: 20260624T093636.953898Z-0009
    description: Running a file-writing skill's happy path as an e2e test inside the live repo entangles test output with real state and leaves side effects behind.
    context: Running a skill's own happy path as an end-to-end test inside the same working repo, where the skill writes files (reports, scratch dirs, .gitignore entries) to the project root.
    what_happened: >
      The tech-spike e2e run wrote SPIKE-REPORT.md to the repo root, created .tmp/ and tech-spike-workspace/, and
      appended `.tmp` to the real .gitignore. The agent then manually rm'd each artifact, and on the .gitignore line
      decided "I'll leave it since it's correct for this repo going forward" — keeping a side effect produced by a
      test run rather than restoring pre-test state.
    root_cause: >
      The skill-under-test ran against the real project directory with no sandbox/worktree isolation, so its
      production-intended writes landed in the repo and entangled cleanup with real-vs-test judgment calls.
    correct_approach: >
      Run e2e tests of file-writing skills in an isolated copy (temp dir or git worktree / clean clone), or snapshot
      `git status` before and `git checkout`/restore after, so cleanup is mechanical and no test side effect silently
      survives.
    key_insight: Testing a file-writing skill in its own live repo conflates test output with real state; isolate the run so cleanup is a reset, not a judgment call about which side effects to keep.
    git_commit: fb927ec6c95ec06ec08e84928654bc30f717eb30
    files: [skills/tech-spike/SKILL.md, .gitignore]
    session_ids: [39a92edd-4245-43b3-a480-d3fff3ac5d39, a633cdef650f8d31a]
    task_id: null
    sources:
