  - id: 20260623T160816.998365Z-0019
    description: Before rewriting a tmux-orchestration skill onto a new tool (ntm), the agent first ran the candidate ntm commands against a real, live executor session (auto-stack--execute) to confirm what structured data they actually return, rather than trusting --help text. This caught that --help is unusable on ntm's --robot-* flags (they treat '--help' as a session name and error with SESSION_NOT_FOUND) and confirmed which commands surface task IDs, phase progress, and context %.
    context: Applies when migrating a skill from one tooling primitive to another (here raw tmux capture-pane/send-keys -> ntm status/send/grep/copy). The empirical check against a live session was what validated the rewrite and shaped the final command set; ntm's robot subcommands have no working --help and must be probed by actually invoking them on a real session.
