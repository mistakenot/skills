  - id: 20260623T160816.998387Z-0025
    description: '`npx skills check` / `npx skills update` can report ''All skills are up to date'' while only inspecting a single skill (it checked 1 skill in a repo with 18), so it cannot be trusted as proof that selectively-installed downstream skills are current. To verify or refresh reliably, drive installs explicitly (e.g. a generated install.sh delegating to `npx skills add <repo> -s <list>`) rather than relying on the check/update output.'
    context: Relevant when reasoning about how downstream consumers keep selectively-installed skill subsets in sync, or when debugging why `npx skills check` claims everything is current. Corroborates known CLI gotchas about scope resolution in non-interactive shells.
    git_commit: 931dd416acf2b06ae581d492262dbe72c7103b9e
