  - id: 20260624T093636.953947Z-0015
    description: A test that passes the real src/ dir into compile() clobbered the repo's install.sh; tests calling compile() must use an isolated nested tmp repo layout.
    context: Writing a unit test that calls the skill compiler's `compile()` / `_generate_install_script` against a directory, in a repo where compile writes install.sh and mirrored skill trees.
    what_happened: >
      `test_real_module_compiles` used the real `src/` dir as `src_dir`, causing `_generate_install_script` to clobber
      the repo's `install.sh` with only the assurance module. Tests passed, but the working tree was corrupted — the
      bug was caught by the independent PR reviewer, not by the phase-D subagent that wrote the test.
    root_cause: >
      compile() has filesystem side effects (it writes install.sh and skill mirrors relative to the dir it is given);
      pointing it at the live repo made the test mutate real tracked files while still exiting green.
    correct_approach: >
      Run any test that calls compile() against an isolated nested `tmp_path/repo/src` layout so all side effects land
      inside the temp dir, never the real repo. This nested-repo pattern is reusable for any compile()-calling test.
    key_insight: A function with filesystem side effects must be tested against a throwaway directory, never the live tree — a green test can still corrupt the repo, and only side-effect isolation (plus a cold reviewer) catches it.
    git_commit: fb927ec6c95ec06ec08e84928654bc30f717eb30
