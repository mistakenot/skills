  - id: 20260624T093636.953867Z-0003
    description: Codex's "no issues found" signal on a PR is a 👍 reaction by chatgpt-codex-connector[bot], not text in the PR body.
    context: Programmatically detecting whether Codex reviewed a PR and found nothing to address (an address-feedback or CI-feedback flow).
    what_happened: >
      The address-feedback skill was first written to say Codex "leaves a thumbs-up emoji on the main PR comment." A
      follow-up correction noted the thumbs-up is not in the PR body — it is a +1 👍 reaction on the PR added by
      chatgpt-codex-connector[bot]; the PR body text itself contains no emoji.
    root_cause: >
      The initial mental model assumed acknowledgement was inline text/emoji in the comment body; GitHub reactions are
      separate metadata attached by the bot account, not part of the comment content.
    correct_approach: >
      Detect Codex's "all clear" by checking for a +1/👍 reaction from chatgpt-codex-connector[bot] via the reactions
      API, not by grepping the PR body for an emoji.
    key_insight: GitHub reactions are bot-attributed metadata distinct from comment text — detect acknowledgements via the reactions API, not body-text scraping.
    git_commit: fb927ec6c95ec06ec08e84928654bc30f717eb30
    files: [src/planning-workflow/skills/address-feedback/SKILL.md]
