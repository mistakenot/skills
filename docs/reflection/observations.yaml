  - id: 20260623T160816.998318Z-0005
    description: A reviewer that emits zero comments is ambiguous between 'clean review' and 'review failed/produced no output'. Make the reviewer always emit a positive marker on success (e.g. insert a single RESOLVED 'no issues found' comment) so the calling agent can reliably distinguish a clean pass from a failure, and gate downstream resolve steps on that.
    context: 'Surfaced in the request-codex-review/review-task chain: the caller treated COMMENT_COUNT==0 as a Codex failure, but zero comments could mean the docs were clean. Fix was to have review-task drop a clean-review marker comment. Applies to any automated review/verification handoff where ''no findings'' must be machine-distinguishable from ''no run''.'
