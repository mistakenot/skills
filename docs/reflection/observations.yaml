  - id: 20260624T093636.953879Z-0005
    description: Requirements are authoritative — surface every undeclared-but-important design decision to the user as an explicit gate rather than silently inventing a default.
    context: Designing or running the planning workflow (new-task requirements gathering, new-solution/new-plan design) where a thin user prompt must become a concrete spec.
    what_happened: >
      User framed the dominant failure class: "one of the most common class of errors is the AI making solution
      assumptions that aren't explicitly declared. this can lead to it building the wrong thing further down the
      line." Across sessions the user repeatedly added explicit "ask the user" gates — enrich new-task with "assume
      there are latent requirements in the user's head," and add a new-solution "Validate assumptions" step requiring
      AskUserQuestion on any decision not dictated by requirements or established repo patterns — because the audit
      found enforcement was soft and scattered (new-solution/new-plan/review-task had no hard gate).
    root_cause: >
      Agents default to resolving only the questions already written down and silently pick defaults for everything
      else, producing designs the user only discovers and regrets at code-review time. Soft "state your assumptions"
      principles get skipped under pressure to produce an artifact.
    correct_approach: >
      Add a concrete checkpoint before presenting docs: enumerate every decision NOT clearly dictated by (a)
      requirements or (b) established codebase conventions, confirm each via AskUserQuestion, and escalate undeclared
      important decisions back to requirements (e.g. an Open Question / P1 comment) rather than choosing a default.
      Wire it into existing review-format and hard-stop gates rather than adding new ceremony.
    key_insight: The expensive ambiguities are the unstated assumptions an agent resolves silently; force them to the surface as explicit user confirmations before committing to a design.
    git_commit: fb927ec6c95ec06ec08e84928654bc30f717eb30
