  - id: 20260623T160816.998279Z-0001
    description: '`npx skills install <org>/<repo>` (and `make install` which wraps it) fetches skills from the remote GitHub repo, NOT from the local compiled `./skills` output. Newly created/compiled skills will not appear in the install until they are committed and pushed.'
    context: Applies to this repo's skill publishing flow. After adding a skill under src/, compiling, and running `make install`, the freshly compiled skills (e.g. generate-10-ideas, revise-readme) were absent from .claude/skills because the installer pulled the GitHub version. Verify local compiled output exists, but expect new skills to be installable only after push.
    git_commit: 931dd416acf2b06ae581d492262dbe72c7103b9e
    files:
      - Makefile
      - src/compile.py
    session_ids:
      - c0e15b7a-f9e1-419f-9425-5c2873de542e
    task_id: null
    sources:
