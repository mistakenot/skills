        ref: c0e15b7a-f9e1-419f-9425-5c2873de542e-58
  - id: 20260623T160816.998303Z-0002
    description: The `npx skills` `--all` flag expands to `--agent '*'`, which creates a skills folder for EVERY agent type and copies files into `./skills`. To target only Claude Code and Codex (the desired behaviour here), use `npx skills install <org>/<repo> -s '*' -a claude-code codex -y` instead, which installs to `.agents/skills/` (Codex) and symlinks into `.claude/skills/` without a `./skills` copy.
    context: Charlie corrected the install command twice. The repo's canonical install command is `npx skills install mistakenot/skills -s '*' -a claude-code codex -y` and was saved to project memory. Relevant whenever generating install instructions for this skills repo.
    git_commit: 931dd416acf2b06ae581d492262dbe72c7103b9e
