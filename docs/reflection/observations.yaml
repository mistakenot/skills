  - id: 20260623T160816.998345Z-0013
    description: When a skill needs to use a search/discovery tool, the user prefers it instruct the agent to run `autosearch quickstart` to discover available tools at runtime and pick the best fit if useful, rather than hardcoding a specific command (e.g. `autodoc search keyword <query>`). Runtime tool discovery keeps skills portable across repos where different tooling is installed.
    context: Applies when writing skill instructions that reference search/doc-lookup tooling. Hardcoding a tool the target repo may not have is brittle; deferring to `autosearch quickstart` adapts to whatever is available. Phrase it as optional ('if useful').
    git_commit: 931dd416acf2b06ae581d492262dbe72c7103b9e
