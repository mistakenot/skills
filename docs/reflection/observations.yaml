  - id: 20260623T160816.998331Z-0009
    description: 'A Vite dev server proxied over Tailscale gives a mobile PWA no offline support: every reload refetches the JS bundle from the dev server, so a flaky/down tailnet link blanks the page, and there is no service worker. The fix pattern (already proven in the `teach` repo) is to serve a production build with `vite-plugin-pwa` (workbox precache + navigateFallback to index.html) behind a PM2 `ecosystem.config.cjs`, and point `tailscale serve` at the preview port.'
    context: 'Applies when a mobile-first SPA is being served to a phone via `tailscale serve` pointing at `vite dev`, and the user reports it doesn''t persist across reloads or breaks when offline. The cosmetic PWA manifest (display: standalone) without a service worker is the tell. The opencode app had this; the teach app had the working pattern.'
    git_commit: 931dd416acf2b06ae581d492262dbe72c7103b9e
    files:
      - src/teach/vite.config.ts
      - src/teach/ecosystem.config.cjs
    session_ids:
