  - id: 20260623T160816.998338Z-0011
    description: 'The user enforced a strict git push-failure escalation for skills that push to main: on a rejected push, first try `git pull --rebase` then push; if the rebase conflicts, `git rebase --abort` and try `git pull --no-rebase` then push; if that also fails, stop and ask for help. Never force-push and never discard changes.'
    context: Applies when authoring/editing any workflow skill (e.g. commit-task) that commits and pushes directly to main, in a repo where 'commit and push' means straight to origin/main with no PR. The escalation ladder is the canonical safe-merge contract.
