      artifacts rather than (only) from a persisted state file. Is the plan
      written? Check if plan.md exists and has content. Is the PR open? Check
      git branch state. Are tests passing? Run them. This is the concrete
      mechanism behind I015's principle (observe-fresh-state-first) — instead
      of maintaining a separate tracker that can diverge, make the artifacts
      themselves the source of truth for workflow progress. Complementary
      to I014 (state baton): the baton records intent/terminal-status, while
      filesystem checks verify actual progress.
    evidence: |
      state.ts detectCompleted(): for each artifact, check if generates path
      exists on disk (glob-aware via outputs.ts). Returns Set<artifactId>.
      No database, no JSON state file, no in-memory cache.
