    effort: M
    impact: high
    risk: low
    confidence: medium
    dependencies: none
    score: 5
    summary: |
      Champion + score + working set + UNTOUCHED holdout + must-pass checks;
      change one thing per round; promote a challenger only on a regression-free
      holdout win, else keep the champion. Revolve adds revision boundaries +
      checkpoints + an internal-before-live promotion gate. Separating the
      working signal from a fresh acceptance gate limits overfitting.
    application: |
      Restructure our description/skill optimization (skill-creator + assurance
      evals) to split a frozen holdout, keep the current best by default, and
      promote only on a regression-free holdout win. This is the loop mentality
      applied to our own self-improvement — a self-strengthening loop that does
      not game its own metric.
    evidence: |
      champion why: "Separating the working set from fresh holdout cases limits
      overfitting." SKILL.md: "Separate the working signal from a fresh
      acceptance gate ... that could overfit its own metric."
    notes: |
      Loop-mentality survivor from pass 1; sits under the I017 doctrine for
      self-optimizing loops.

