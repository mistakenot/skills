profile:
  recorded: 2026-06-20
  project: |
    A public repository of reusable, multi-agent-compatible agent skills. The
    headline product is the "Portable Task Workflow" — an AI-agent-driven feature
    delivery lifecycle (requirements -> solution -> context -> plan -> worktree
    execution -> PR -> review -> merge -> feedback), with each stage a discrete
    skill invoked via slash command. Beyond the planning workflow it also ships
    skills for ideation, exploration, reflection, maintenance, research, and an
    assurance-strategist with its own eval harness.
  architecture: |
    Skills are authored in `src/<group>/` (planning-workflow, beta-planning,
    ideation, exploration, reflection, maintenance, research, rich-docs,
    assurance) and COMPILED by `src/compile.py` into the flat `skills/` output
    dir (29 skills today). `make compile` regenerates output; `make install`
    runs `npx skills install` to publish into claude-code + codex agents.
    Tooling: `autoskill lint`; `autodoc` for the docs index. `uv` runs all
    Python. The autonomous-execution family — execute-task, delegate,
    delegate-task, status-report, complete-task — is where agents already run
    with the least human supervision, and is the primary surface for the
    autonomy doctrine below.
  stack: [Python, "Markdown skills", TypeScript, JavaScript, HTML, Bash]
  goals: |
    PRIMARY (clarified 2026-06-20): increase the AUTONOMY of our agents by
    embodying the "loop mentality" — restructure our autonomous skills as
    bounded feedback loops that can run unattended *because* they have a
    verifiable definition of done, independent verification, resumable state,
    explicit terminal states, and consequential decisions held behind gates.
    Autonomy is unlocked by reliable stopping and verification, not by removing
    the human.
    Supporting goals:
    - Skills multi-agent compatible (Claude Code, Codex, Opencode, ...).
    - High-quality routing descriptions so the right skill triggers.
    - Reusable across projects; quality enforced by lint/compile.
  non_goals: |
    - SEO / GEO / search-engine visibility work.
    - A public marketing website, social-card generation, or web hosting.
    - Backend infrastructure (Cloudflare Workers, form handling, here.now).
    - "Endless autonomy" / unbounded agents: the goal is BOUNDED autonomy with
      terminal states, never an agent with permission to run forever.

