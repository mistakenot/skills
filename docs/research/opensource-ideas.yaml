ideas:
  # newest first. I025-I035 are from obra/superpowers baseline snapshot.
  # I018-I024 are from Fission-AI/OpenSpec baseline snapshot.
  # I010-I017 are the autonomy-doctrine pass from Forward-Future/loop-library.

  - id: I035
    title: "Two-verdict reviewer: require separate spec-compliance and code-quality verdicts"
    source: obra/superpowers
    commits: []
    files: [skills/subagent-driven-development/task-reviewer-prompt.md]
    permalink: https://github.com/obra/superpowers/blob/896224c4b1879920ab573417e68fd51d2ccc9072/skills/subagent-driven-development/task-reviewer-prompt.md
    discovered: 2026-06-23
    status: candidate
    change_type: additive
    area: "request-claude-review, request-codex-review, code-review"
    effort: S
    impact: medium
    risk: low
    confidence: high
    dependencies: none
    score: 6
    summary: |
      SDD's task reviewer must return TWO independent verdicts: spec compliance
      (does the implementation match the plan?) and code quality (is the code
      well-written?). Missing either verdict is a Red Flag. Critical/Important
      findings trigger a fix→re-review loop. The reviewer reads the diff file
      in one read, doesn't re-run tests, and doesn't crawl the codebase except
      for one focused check per named risk. "Cannot verify from diff" items
      don't block but the controller must resolve each (it holds cross-task
      context the reviewer lacks).
    application: |
      Structure our review skills (request-claude-review, request-codex-review)
      to require two separate verdicts: (1) spec/plan compliance — does this
      implement what was asked? and (2) code quality — is the code sound? This
      prevents the common failure where a clean code review passes work that
      doesn't match the spec, or spec-compliant code with quality issues slips
      through. Our I018 (three-dimension verification) provides the vocabulary;
      this is the concrete reviewer output format.
    evidence: |
      task-reviewer-prompt.md: reviewer returns both verdicts, missing either =
      Red Flag. Controller resolves "cannot verify from diff" items that the
      reviewer flags but can't check.
    notes: |
      Complements [[I018]]. The dimensions are the framework; this is how the
      reviewer actually reports them.

  - id: I034
    title: "Verification-as-honesty: iron law + revert proof + rationalization prevention tables"
    source: obra/superpowers
    commits: []
    files: [skills/verification-before-completion/SKILL.md]
    permalink: https://github.com/obra/superpowers/blob/896224c4b1879920ab573417e68fd51d2ccc9072/skills/verification-before-completion/SKILL.md
    discovered: 2026-06-23
    status: shortlisted
    change_type: additive
    area: "execute-task, complete-task, verify skill"
    effort: S
    impact: high
    risk: low
    confidence: high
    dependencies: none
    score: 10
    summary: |
      "Claiming work is complete without verification is dishonesty, not
      efficiency." The verification-before-completion skill defines an iron
      law: NO COMPLETION CLAIMS WITHOUT FRESH VERIFICATION EVIDENCE. Gate
      function: IDENTIFY proving command → RUN fresh → READ full output + exit
      code → VERIFY → ONLY THEN claim. A red-green revert mechanic: run
      (pass) → revert fix → run (MUST FAIL) → restore → run (pass). Includes
      exhaustive tables: Common Failures (claim→required evidence→insufficient),
      Red Flags-STOP ("using should/probably", "saying Done! pre-verification",
      "trusting agent reports"), Rationalization Prevention ("Different words so
      rule doesn't apply" → "Spirit over letter"). Born from 24 failure
      memories; stakes: "if you lie, you'll be replaced."
    application: |
      Add a verification-as-honesty section to our execute-task and
      complete-task skills: (1) the iron law — no completion claims without
      fresh evidence run THIS turn; (2) the revert-proof mechanic — a test
      only counts if removing the fix makes it fail; (3) a compact
      rationalization-prevention table tuned to our context. This is the
      CULTURE that makes our I010 completion contract trustworthy — the
      contract defines what done means, this defines the honesty bar for
      claiming you reached it. The revert-proof extends our I012 (prove-the-
      test) with a concrete procedure. Together they make "verified, tests
      pass" a statement an autonomous agent can be trusted to make.
    evidence: |
      SKILL.md iron law: "NO COMPLETION CLAIMS WITHOUT FRESH VERIFICATION
      EVIDENCE." Gate: identify→run→read→verify→claim. Red Flags table:
      "saying Great!/Perfect!/Done! before verification." Rationalization
      Prevention: "It's about spirit not ritual" → "Violating the letter of
      the rules is violating the spirit of the rules."
    notes: |
      Strengthens [[I010]], [[I012]]. The contract is what; the honesty bar
      is how. S effort because it's adding rules/tables to existing skills,
      not building new machinery.

  - id: I033
    title: "Recorded BASE commit: the HEAD~1 trap for multi-commit tasks"
    source: obra/superpowers
    commits: []
    files: [skills/subagent-driven-development/SKILL.md]
    permalink: https://github.com/obra/superpowers/blob/896224c4b1879920ab573417e68fd51d2ccc9072/skills/subagent-driven-development/SKILL.md
    discovered: 2026-06-23
    status: candidate
    change_type: additive
    area: "execute-task, code-review, complete-task"
    effort: S
    impact: medium
    risk: low
    confidence: high
    dependencies: none
    score: 6
    summary: |
      SDD records the BASE commit BEFORE dispatching each task implementer,
      then uses that recorded BASE (not HEAD~1) for the review diff. HEAD~1
      is a documented trap: a multi-commit task's review would only show the
      last commit, silently dropping all earlier work from the diff. The
      review-package script takes explicit BASE and HEAD arguments.
    application: |
      Add to execute-task and code-review: before dispatching each task,
      record the current HEAD as the task's BASE commit. Use that recorded
      BASE for all review diffs — never HEAD~1. This is a subtle correctness
      fix that prevents review gaps in multi-commit tasks. Cheap to implement
      (one `git rev-parse HEAD` before dispatch, stored in the progress
      ledger alongside the task entry).
    evidence: |
      SKILL.md: "BASE = commit recorded BEFORE dispatch, never HEAD~1."
      review-package script takes explicit BASE HEAD arguments.
    notes: |
      Pairs naturally with [[I032]] (progress ledger stores the BASE).

  - id: I032
    title: "Progress ledger: compaction-proof one-line-per-task resumability"
    source: obra/superpowers
    commits: []
    files: [skills/subagent-driven-development/SKILL.md]
    permalink: https://github.com/obra/superpowers/blob/896224c4b1879920ab573417e68fd51d2ccc9072/skills/subagent-driven-development/SKILL.md
    discovered: 2026-06-23
    status: shortlisted
    change_type: additive
    area: "execute-task, delegate-task, status-report"
    effort: S
    impact: high
    risk: low
    confidence: high
    dependencies: none
    score: 10
    summary: |
      SDD's worst observed failure: after context compaction, the controller
      re-dispatched an entire completed task sequence. Mitigation: a progress
      ledger at .superpowers/sdd/progress.md — one line per task: "Task N:
      complete (commits <base7>..<head7>, review clean)". On start, cat the
      ledger; completed = DONE, resume at first incomplete. Rule: "After
      compaction, trust the ledger and git log over your own recollection."
    application: |
      Give execute-task / delegate-task a one-line-per-task progress ledger
      in the self-ignoring workspace (see I031). Each entry: task ID,
      status, commit range, review verdict. On session start or after
      compaction, read the ledger before doing anything — resume at the
      first incomplete task, never re-do completed work. This is the
      concrete, opinionated implementation of our I014 (resumable state
      baton) — the baton is specifically a progress ledger, and the rule is
      specifically "trust the ledger over your memory." Directly extends
      how long a run can go unattended.
    evidence: |
      SKILL.md: progress ledger at .superpowers/sdd/progress.md, one line
      per task: "Task N: complete (commits <base7>..<head7>, review clean)."
      "After compaction, trust the ledger and git log over your own
      recollection." Worst failure: controller re-dispatched completed
      tasks after compaction.
    notes: |
      Concrete implementation of [[I014]]. Pairs with [[I031]] (workspace)
      and [[I033]] (recorded BASE stored in the ledger).

  - id: I031
    title: "Self-ignoring artifact workspace: .superpowers/sdd/ with gitignore '*'"
    source: obra/superpowers
    commits: []
    files: [skills/subagent-driven-development/SKILL.md]
    permalink: https://github.com/obra/superpowers/blob/896224c4b1879920ab573417e68fd51d2ccc9072/skills/subagent-driven-development/SKILL.md
    discovered: 2026-06-23
    status: candidate
    change_type: additive
    area: "execute-task, delegate-task"
    effort: S
    impact: medium
    risk: low
    confidence: high
    dependencies: none
    score: 6
    summary: |
      SDD creates .superpowers/sdd/ in the WORKING TREE (not .git/, which
      harnesses deny agent writes to) with a .gitignore containing just `*`.
      This makes the directory invisible to git status/add without touching
      tracked .gitignore files. Worktree-aware: each linked worktree resolves
      its own workspace. Contains briefs, review packages, and the progress
      ledger. The sdd-workspace script handles creation + self-ignoring setup.
    application: |
      Adopt a self-ignoring workspace pattern for our autonomous execution
      skills: a .<project>/task/ directory (or .task/) with its own `*`
      gitignore. Store the progress ledger (I032), task briefs, review
      packages, and any transient state here. Benefits: (1) invisible to git
      without editing tracked files, (2) each worktree gets its own, (3) no
      .git/ write issues, (4) `rm -rf` cleans up completely. This is the
      concrete filesystem mechanism for I014 (resumable state baton) and I020
      (filesystem-as-state).
    evidence: |
      sdd-workspace script: creates .superpowers/sdd/ + .gitignore with `*`.
      test-sdd-workspace.sh: verifies git invisibility, per-worktree
      isolation, brief/review-package output locations.
    notes: |
      Mechanism for [[I014]], [[I020]], [[I032]]. Tested in their test suite.

  - id: I030
    title: "One fixer per final review, not per-finding: the context-rebuild cost trap"
    source: obra/superpowers
    commits: []
    files: [skills/subagent-driven-development/SKILL.md]
    permalink: https://github.com/obra/superpowers/blob/896224c4b1879920ab573417e68fd51d2ccc9072/skills/subagent-driven-development/SKILL.md
    discovered: 2026-06-23
    status: candidate
    change_type: additive
    area: "execute-task, address-feedback"
    effort: S
    impact: medium
    risk: low
    confidence: high
    dependencies: none
    score: 6
    summary: |
      SDD's final whole-branch review dispatches ONE fix subagent with the
      full list of findings, not one subagent per finding. Lesson learned from
      a real session: per-finding fix waves "cost more than all its tasks
      combined" because each fixer rebuilds the full codebase context and
      re-runs the test suite independently. One fixer with the full list
      amortizes context-building and test runs.
    application: |
      When our execute-task or address-feedback dispatches fixes for review
      findings, batch all findings into ONE fix subagent rather than spawning
      one per finding. This is especially important for the final whole-branch
      review where findings span multiple files. The per-finding pattern looks
      more parallel but the context-rebuild cost dominates. Add this as a
      documented anti-pattern in execute-task: "one fixer with all findings,
      not one fixer per finding."
    evidence: |
      SKILL.md: "ONE fix subagent with full list" for final-review findings.
      Per-finding wave cited as a real session cost disaster.
    notes: |
      Cost/efficiency lesson from production use. Applies to our
      address-feedback skill as well.

  - id: I029
    title: "No-placeholders rule with exhaustive plan-failure definitions"
    source: obra/superpowers
    commits: []
    files: [skills/writing-plans/SKILL.md]
    permalink: https://github.com/obra/superpowers/blob/896224c4b1879920ab573417e68fd51d2ccc9072/skills/writing-plans/SKILL.md
    discovered: 2026-06-23
    status: candidate
    change_type: additive
    area: "new-plan, beta-new-plan, review-task"
    effort: S
    impact: medium
    risk: low
    confidence: high
    dependencies: none
    score: 6
    summary: |
      writing-plans declares specific "plan failures" — patterns that make a
      plan unusable by an isolated subagent: (1) "TBD/TODO" anywhere, (2) "add
      appropriate error handling" without code, (3) "write tests for the above"
      without test code, (4) "Similar to Task N" (tasks may be read out of
      order, so must repeat). Plans assume the implementer "has zero context
      for our codebase and questionable taste" / doesn't know good test design.
      The self-review checklist scans for these before handoff.
    application: |
      Add a no-placeholders scan to our new-plan / beta-new-plan self-review
      step: enumerate the specific failure patterns (TBD, vague directives,
      cross-references without repetition) and reject them. This is cheap
      (a few lines in the plan-writing skill) and directly improves plan
      quality for autonomous execution. Our plans already have AC traceability;
      this adds the complement — ensuring the plan BODY is implementable by
      an isolated agent, not just traceable to requirements.
    evidence: |
      SKILL.md: "No 'TBD/TODO'", "No 'add appropriate error handling'", "No
      'write tests for the above' without test code", "No 'Similar to Task N'
      (must repeat code since tasks may be read out of order)." Plans assume
      implementer has zero context.
    notes: |
      Quality gate that directly supports autonomous execution.

  - id: I028
    title: "Anti-pre-judgment rule: controller must not bias the reviewer"
    source: obra/superpowers
    commits: []
    files: [skills/subagent-driven-development/SKILL.md]
    permalink: https://github.com/obra/superpowers/blob/896224c4b1879920ab573417e68fd51d2ccc9072/skills/subagent-driven-development/SKILL.md
    discovered: 2026-06-23
    status: candidate
    change_type: additive
    area: "execute-task, request-claude-review, request-codex-review"
    effort: S
    impact: medium
    risk: low
    confidence: medium
    dependencies: none
    score: 6
    summary: |
      SDD's controller must NEVER tell the reviewer what not to flag, pre-rate
      severity ("at most Minor", "the plan chose this approach"), or otherwise
      bias the review. Plan-mandated defects (things the plan deliberately
      chose that the reviewer flags as issues) are HUMAN decisions, not
      controller decisions. "The plan does not grade its own work." A stated
      rationale never downgrades a finding's severity.
    application: |
      Add an anti-pre-judgment rule to our execute-task and review-dispatch
      skills: when dispatching a reviewer, provide only the diff, the spec,
      and global constraints — never include controller commentary on what
      to ignore or how severe findings are. If the reviewer flags something
      the plan deliberately chose, escalate to the human rather than
      dismissing it. This strengthens our I011 (generator != approver) with
      a concrete mechanism: the separation isn't just "different agent" but
      "no information leakage from generator to approver about expected
      findings."
    evidence: |
      SKILL.md: controller must NEVER tell reviewer what not to flag or
      pre-rate severity. "The plan does not grade its own work." Plan-
      mandated defects are human decisions.
    notes: |
      Extends [[I011]] with a concrete information-barrier mechanism.

  - id: I027
    title: "File-based handoffs: pass paths not pasted content to subagents"
    source: obra/superpowers
    commits: []
    files: [skills/subagent-driven-development/SKILL.md, skills/dispatching-parallel-agents/SKILL.md]
    permalink: https://github.com/obra/superpowers/blob/896224c4b1879920ab573417e68fd51d2ccc9072/skills/subagent-driven-development/SKILL.md
    discovered: 2026-06-23
    status: shortlisted
    change_type: additive
    area: "execute-task, delegate-task, delegate"
    effort: S
    impact: medium
    risk: low
    confidence: high
    dependencies: none
    score: 7
    summary: |
      SDD passes briefs, reports, and review diffs as FILE PATHS to subagents,
      never pasting the content into the dispatch prompt. Pasted text stays
      resident in every subsequent turn and gets re-read on each compaction.
      Real failure cited: a dispatch hit 42k chars, 99% was pasted history from
      prior tasks. The dispatching-parallel-agents skill reinforces: "They
      should never inherit your session's context or history — you construct
      exactly what they need."
    application: |
      Restructure our execute-task / delegate-task subagent dispatch to pass
      file paths instead of pasting plan content, task briefs, or review
      diffs into the prompt. Write transient artifacts (task brief, review
      package) to the self-ignoring workspace (I031) and pass the path. The
      subagent reads what it needs; the controller's context stays clean for
      coordination. This directly extends how many tasks a single controller
      session can manage before compaction — a concrete autonomy multiplier.
    evidence: |
      SKILL.md: "pasted text stays resident + re-read every turn, so
      briefs/reports/diffs all move as FILE PATHS, never pasted." Real
      failure: dispatch hit 42k chars. dispatching-parallel-agents: "you
      construct exactly what they need... preserves your own context for
      coordination work."
    notes: |
      Serves the autonomy goal by extending controller session lifespan.
      +1 for serving stated goal.

  - id: I026
    title: "Pre-flight plan review: batch all contradictions into one human question before execution"
    source: obra/superpowers
    commits: []
    files: [skills/subagent-driven-development/SKILL.md]
    permalink: https://github.com/obra/superpowers/blob/896224c4b1879920ab573417e68fd51d2ccc9072/skills/subagent-driven-development/SKILL.md
    discovered: 2026-06-23
    status: shortlisted
    change_type: additive
    area: "execute-task"
    effort: S
    impact: medium
    risk: low
    confidence: high
    dependencies: none
    score: 7
    summary: |
      Before executing any task, SDD's controller scans the plan ONCE for
      self-contradictions and for anything the plan mandates that the review
      rubric would treat as a defect. ALL conflicts are batched into one
      human question before execution begins. If the plan is clean, proceed
      silently. This prevents wasting subagent cycles on tasks that will fail
      review due to plan-level issues.
    application: |
      Add a pre-flight scan step to execute-task: before dispatching the
      first task, read the full plan once and check for (1) internal
      contradictions (e.g. Task 3 says clearLayers() but Task 7 says
      clearFullLayers()), (2) plan-mandated choices that our review criteria
      would flag as defects, (3) missing interface definitions between
      tasks. Batch all findings into one question for the user. This is
      cheap (one plan read + one question) and prevents the expensive
      failure of discovering plan bugs mid-execution after several subagent
      cycles have already run.
    evidence: |
      SKILL.md: "scan once for self-contradictions and for anything the plan
      mandates that the rubric treats as a defect; batch ALL conflicts into
      one human question before execution." Self-review checklist: "type
      consistency across tasks (e.g. clearLayers() in T3 vs clearFullLayers()
      in T7 is a bug)."
    notes: |
      Serves the autonomy goal by front-loading plan-quality checks.
      +1 for serving stated goal.

  - id: I025
    title: "Consumes/Produces interface blocks for isolated subagent task execution"
    source: obra/superpowers
    commits: []
    files: [skills/writing-plans/SKILL.md]
    permalink: https://github.com/obra/superpowers/blob/896224c4b1879920ab573417e68fd51d2ccc9072/skills/writing-plans/SKILL.md
    discovered: 2026-06-23
    status: shortlisted
    change_type: additive
    area: "new-plan, beta-new-plan, execute-task"
    effort: M
    impact: high
    risk: low
    confidence: high
    dependencies: none
    score: 6
    summary: |
      Each task in a writing-plans plan carries a structured interface block:
      Consumes (exact function signatures, types, and names from earlier tasks
      this task depends on) and Produces (exact names and types later tasks
      rely on). "A task's implementer sees only their own task; this block is
      how they learn the names and types neighboring tasks use." This is the
      linchpin that makes isolated subagent execution possible — each
      implementer can work without reading the full plan or other tasks.
      Plans also carry a Files block (Create:/Modify:path:line-range/Test:)
      per task and Global Constraints copied verbatim into every dispatch.
    application: |
      Add Consumes/Produces interface blocks to our plan format (new-plan,
      beta-new-plan). Each task declares what it needs from prior tasks
      (names, types, signatures) and what it exports for later tasks. This
