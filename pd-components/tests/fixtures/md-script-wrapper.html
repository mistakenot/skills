## Form requirements

The form must include:

- A `<textarea>` for multi-line input
- A `<select>` dropdown for category
- A `<script>` tag for validation logic
- An `<iframe>` for preview

Each field validates on blur.

```typescript

  return new Parser<T>().run(input);
}
