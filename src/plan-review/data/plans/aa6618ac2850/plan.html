    <pd-tab name="Requirements">
      <pd-scope></pd-scope>

      <pd-section id="problem" title="Problem">
        <md><script type="text/plain">
`Table.insert(..., pk='id', ignore=True)` raises an `IndexError` when the SQLite
connection has previously written rows to a *different* table. After an `INSERT OR IGNORE`
that skips a duplicate row, `result.lastrowid` is non-zero (it reflects the last successful
insert across the entire connection), so the guard `if self.last_rowid` is truthy. The code
then queries `rowid = result.lastrowid` against the *target* table — which never had a row
with that rowid — and `[0]` on an empty list raises `IndexError`.

Affected code: `sqlite_utils/db.py` line 4390–4392.
        </script></md>
      </pd-section>

      <pd-section id="goals" title="Goals">
        <md><script type="text/plain">
- Fix the `IndexError` so `insert(..., pk=..., ignore=True)` does not crash when other
  tables have been written to first.
- Preserve existing behaviour: `last_pk` is set correctly when a row *is* inserted.
- Add a regression test that reproduces the exact scenario from issue #554.
        </script></md>
      </pd-section>

      <pd-section id="out-of-scope" title="Out of Scope">
        <md><script type="text/plain">
- Setting `last_pk` to a useful value when an insert is ignored (e.g. looking up the
  existing row's pk). This is a separate improvement and can be addressed separately.
- Any changes to `upsert`, `replace`, or batch-insert code paths.
- SQLite version compatibility shims beyond the `rowcount` check.
        </script></md>
      </pd-section>

      <pd-section id="open-questions" title="Open Questions">
        <md><script type="text/plain">
**Assumptions (comfortable proceeding on):**

- [ ] `cursor.rowcount` is 0 when `INSERT OR IGNORE` skips a duplicate row in Python's
  `sqlite3` module. (Well-documented CPython behaviour; confirmed by SQLite spec.)
- [ ] `last_pk` can remain whatever the `else` branch sets it to (`self.last_rowid`) when
  an insert is ignored. No existing test asserts a specific value after an ignored insert.
        </script></md>
      </pd-section>
    </pd-tab>

    <!-- ═══════════════════════════════════════════════════
         TAB 3: SOLUTION
         ═══════════════════════════════════════════════════ -->
    <pd-tab name="Solution">

      <pd-section id="approach" title="Approach">
        <md><script type="text/plain">
Add `result.rowcount` to the existing guard at `db.py:4390`.

**Current code:**
```python
self.last_rowid = result.lastrowid
if (hash_id or pk) and self.last_rowid:
    row = list(self.rows_where("rowid = ?", [self.last_rowid]))[0]
```

**Fixed code:**
```python
self.last_rowid = result.lastrowid
if (hash_id or pk) and self.last_rowid and result.rowcount:
    row = list(self.rows_where("rowid = ?", [self.last_rowid]))[0]
```

**Why `result.rowcount`?**
`cursor.rowcount` is 0 when `INSERT OR IGNORE` skips a duplicate row and 1 when a row
is actually written. Unlike `lastrowid`, it is scoped to the *current* statement, not
the connection. Adding it to the guard prevents the rowid lookup when nothing was
inserted, regardless of what the global `lastrowid` happens to be.

The existing comment `# self.last_rowid will be 0 if a "INSERT OR IGNORE" happened` is
updated to reflect the new, correct condition.
        </script></md>
      </pd-section>

      <pd-files>

      </pd-files>

      <pd-section id="rejected-alternatives" title="Rejected Alternatives">
        <md><script type="text/plain">
- **Wrap `rows_where` call and check for empty list**: `rows = list(...); if rows: row = rows[0]`.
  Handles the crash but doesn't use the most semantically correct signal — `rowcount`
  directly says "did an insert happen?". Also leaves a subtle fallthrough into
  `self.last_pk = self.last_rowid` with a foreign-table rowid value.

- **Compare `result.lastrowid` against the table's max rowid before the insert**: Requires
  an extra query and a race if concurrent writes are possible. Over-engineered for this fix.

- **Set `last_pk = None` when insert is ignored**: More correct semantically, but changes
  observable API behaviour and may break callers that rely on `last_pk` being set after
  an ignored insert (even if that value is currently arbitrary). Out of scope for a bug fix.
        </script></md>
      </pd-section>

      <pd-decision id="D-1" title="Use result.rowcount rather than a try/except or an empty-list check"
        status="accepted" by="agent"
        summary="rowcount is the right semantic signal for 'did an insert happen?'">
        <md><script type="text/plain">
**Context:** The existing guard (`self.last_rowid != 0`) relied on SQLite returning 0 for
ignored inserts, which is no longer reliable in modern SQLite when other tables have been
written to in the same connection.

**Decision:** Use `result.rowcount` as the authoritative signal. It is always 0 for an
ignored row and 1 for an inserted row, regardless of other tables or connection state.

**Alternatives:** try/except IndexError (hides other bugs), empty-list check (symptom fix,
not root cause), explicit `lastrowid` snapshot (extra round-trip).

**Consequences:** One character change plus a comment update. No API surface changes.
        </script></md>
      </pd-decision>
