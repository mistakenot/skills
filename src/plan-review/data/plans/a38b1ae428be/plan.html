  <pd-doc title="001: default-subcommand" status="draft" pr="pending" generated="2026-09-24">

    <!-- ═══════════════════════════ REQUIREMENTS ═══════════════════════════ -->
    <pd-tab name="Requirements">

      <pd-section id="problem" title="Problem">
        <md><script type="text/plain">
When a `citty` CLI has `subCommands` defined but no `run` function on the parent command, running the CLI with no arguments always throws `E_NO_COMMAND`. There is no way to specify that a particular subcommand should act as the default entry point (e.g. `farm dev` as the default for `farm`). The workaround of defining a `run` function on the parent introduces a second bug: the parent's `run` is called even when an explicit subcommand is invoked, executing the handler twice.
        </script></md>
      </pd-section>

      <pd-section id="goals" title="Goals">
        <md><script type="text/plain">
- Add a `default?: string` field to `CommandDef` that names a subcommand to run when no explicit subcommand argument is provided.
- When `default` is set and no subcommand is given, invoke the named subcommand transparently (passing all raw args through to it).
- When an explicit subcommand name is given, the `default` field is ignored and the explicit subcommand runs as before.
- When `default` is not set, all existing behaviour is unchanged.
- `resolveSubCommand` falls back to the default subcommand so that `--help` displays the correct sub-command usage.
        </script></md>
      </pd-section>

      <pd-section id="out-of-scope" title="Out of Scope">
        <md><script type="text/plain">
- Running both a parent `run` handler AND the default subcommand (the feature replaces one with the other; composing them is a separate concern).
- Showing a "default:" badge in `--help` output (cosmetic; can be a follow-up).
- Recursive default chains (a default subcommand that also has a `default`).
        </script></md>
      </pd-section>

      <pd-section id="open-questions" title="Open Questions">
        <md><script type="text/plain">
- **Assumption**: When `default` is set and the parent also has a `run` function, the default subcommand runs and the parent `run` is **skipped** — consistent with explicit-subcommand behaviour where `run` is never called. This matches the spirit of the issue report.
- **Assumption**: If the `default` key names a subcommand that does not exist in `subCommands`, a runtime error (`CLIError`) is thrown to fail loudly rather than silently falling through.
        </script></md>
      </pd-section>

    </pd-tab>

Coverage philosophy: every branch of the `default` path is exercised (default fires, explicit overrides default, no default still throws, bad default name throws).

      <pd-section id="verification-gaps" title="Known Gaps &amp; Risks">

- `resolveSubCommand` (used by `--help` lookup) is not tested for the default path; the Plan covers a test for it but it may be deferred as a P2 gap.

    <!-- ════════════════════════════ SOLUTION ═════════════════════════════ -->
    <pd-tab name="Solution">

      <pd-section id="approach" title="Approach">
        <md><script type="text/plain">
Add `default?: string` to `CommandDef` in `src/types.ts`. In `src/command.ts`, inside `runCommand`, extend the else-branch that currently handles the "no subcommand name found" case: if `cmd.default` is set, resolve that subcommand via the existing `_findSubCommand` helper and recurse into `runCommand` with the full `rawArgs` (no slice, since there is no subcommand token to skip). If the named default does not exist, throw `CLIError` with code `E_UNKNOWN_COMMAND`.

Also extend `resolveSubCommand` with the same fallback so `--help` dispatches to the right sub-command when called with no arguments on a command that has a `default`.

No changes to `usage.ts` or the public re-export surface — `default` is opaque to the help renderer.
        </script></md>
      </pd-section>

      <pd-files>
        <pd-file path="src/types.ts" change="edit">Add `default?: string` to `CommandDef`</pd-file>
        <pd-file path="src/command.ts" change="edit">Handle `cmd.default` in `runCommand` and `resolveSubCommand`</pd-file>
        <pd-file path="test/main.test.ts" change="edit">Add tests for default-subcommand behaviour (AC-1 through AC-5)</pd-file>
      </pd-files>

      <pd-section id="rejected-alternatives" title="Rejected Alternatives">
        <md><script type="text/plain">
- **`default: CommandDef` (pass the command object directly)**: More flexible but inconsistent with how `subCommands` is keyed. String key reuses the existing lookup path (alias resolution included) for free.
- **Run parent `run` AND default subcommand**: The issue author explicitly notes that calling `run` twice confused them; composing the two handlers is explicitly out of scope.
- **`defaultCommand` as a separate top-level field**: No real advantage over `default`; adds a longer name for no semantic benefit. `default` mirrors the pattern the issue author proposed.
        </script></md>
      </pd-section>

        <pd-phase n="1" title="Type + Runtime (walking skeleton)" files="src/types.ts,src/command.ts,test/main.test.ts" status="todo">
          <md><script type="text/plain">
**Goal**: A thin end-to-end path: type change → runtime change → one green test.

1. **`src/types.ts`** — add `default?: string` to the `CommandDef` interface (after the `subCommands` field, before `plugins`).
2. **`src/command.ts` — `runCommand`** — in the `subCommands` branch, after the existing `else if (!cmd.run)` check, insert:
   ```ts
   } else if (cmd.default) {
     const defaultSub = await _findSubCommand(subCommands, cmd.default);
     if (!defaultSub) {
       throw new CLIError(`Unknown default command ${cyan(cmd.default)}`, "E_UNKNOWN_COMMAND");
     }
     await runCommand(defaultSub, { rawArgs: opts.rawArgs });
   } else if (!cmd.run) {
     throw new CLIError(`No command specified.`, "E_NO_COMMAND");
   }
   ```
   **Important**: the new branch must come before the `else if (!cmd.run)` check, and the parent `run` call that follows must be guarded so it does NOT execute when a default subcommand was dispatched. Introduce a `let ranDefault = false` flag set to `true` when the default branch fires; gate the `cmd.run` call with `&& !ranDefault`.
3. **`test/main.test.ts`** — add a `describe('default subcommand')` block with one test for AC-1 (default fires with empty rawArgs).
4. **Verify**: `pnpm test` (lint + typecheck + vitest) must pass.
5. **Commit**: `feat(command): add default subcommand support (phase 1)`
          </script></md>

        <pd-phase n="2" title="Tests + resolveSubCommand" files="src/command.ts,test/main.test.ts" status="todo" depends-on="1">
          <md><script type="text/plain">
**Goal**: Full AC coverage and `resolveSubCommand` correctness.

1. **`test/main.test.ts`** — add remaining tests in the `describe('default subcommand')` block:
   - AC-2: explicit subcommand overrides default
   - AC-3: no `default` still throws `E_NO_COMMAND`
   - AC-4: parent `run` is skipped when default fires
   - AC-5: unknown default name throws `CLIError`
2. **`src/command.ts` — `resolveSubCommand`** — after the existing subcommand-name lookup, add a fallback for `cmd.default`:
   ```ts
   if (subCommands && Object.keys(subCommands).length > 0) {
     const cmdArgs = await resolveValue(cmd.args || {});
     const subCommandArgIndex = findSubCommandIndex(rawArgs, cmdArgs);
     const subCommandName = rawArgs[subCommandArgIndex]!;
     const subCommand = await _findSubCommand(subCommands, subCommandName)
       ?? (cmd.default ? await _findSubCommand(subCommands, cmd.default) : undefined);
     if (subCommand) {
       return resolveSubCommand(subCommand, rawArgs.slice(subCommandArgIndex + 1), cmd);
     }
   }
   ```
3. **Verify**: `pnpm test` must pass; `pnpm test:types` clean.
4. **Commit**: `feat(command): extend resolveSubCommand with default fallback + full tests (phase 2)`
