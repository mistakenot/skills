<pd-doc title="065: skill-add-comma-filter" status="draft" pr="pending" generated="2026-09-23">

  <pd-tab name="Requirements">

    <pd-section id="problem" title="Problem">
      <md><script type="text/plain">
`auto skill add --skill` is declared with `StringArrayVar`, so cobra treats each
`--skill` value verbatim — no comma splitting. Users (and agents especially) commonly
pass `--skill a,b` expecting two skills to be installed. Cobra puts the literal string
`"a,b"` into the filter, which matches nothing and returns the error
`skill(s) not found: a,b; available: …`. That message names the wrong skill and gives
no hint that the correct form is `--skill a --skill b`.

A secondary gap: when the `--skill` filter produces no matches, the available-skills
list is buried in the same error line with no guidance, making it easy to overlook.
      </script></md>
    </pd-section>

    <pd-section id="goals" title="Goals">
      <md><script type="text/plain">
- **Accept comma-separated names**: `--skill a,b` installs both `a` and `b`, identical
  to `--skill a --skill b`. Aligns with `auto-etl`'s `--only` flag (already uses
  `StringSliceVar`).
- **Fail loudly with a hint** when `--skill` values don't match any skill in the
  source: the error lists available skills and shows the repeatable flag form as an
  example.
- **Stay consistent** with how other auto commands handle list flags (no new
  patterns introduced).
      </script></md>
    </pd-section>

    <pd-section id="out-of-scope" title="Out of Scope">
      <md><script type="text/plain">
- Changing `--path` (also `StringArrayVar`) — no reported pain there.
- Changing `sync --target` — separate command, not mentioned in the request.
- Fuzzy / prefix matching for skill names.
- Any changes to the `update` command's positional-args skill name handling.
      </script></md>
    </pd-section>

    <pd-section id="open-questions" title="Open Questions">
      <md><script type="text/plain">
- **Assumption**: skill names are always kebab-case `^[a-z0-9]+(?:-[a-z0-9]+)*$` — commas
  are never valid in a skill name, so splitting on commas is lossless. Confirmed from
  `CLAUDE.md` and validation code.
- **Assumption**: `StringSliceVar` (cobra's CSV type) is the right vehicle — it handles
  both `--skill a,b` and `--skill a --skill b` and is already used for `auto-etl --only`.
  No custom parsing needed.
      </script></md>
    </pd-section>

  </pd-tab>

    <pd-section id="verification-gaps" title="Known Gaps &amp; Risks">
      <md><script type="text/plain">
- `StringSliceVar` parses values as CSV, which means a value like `"a, b"` (space
  after comma) would produce `["a", " b"]`. The existing normalisation
  `strings.TrimSpace(s)` in `applySelection` already handles leading/trailing spaces,
  so this is safe.
- No harness-level (Docker) test is added for this change — the integration test suite
  covers it adequately; a harness scenario would duplicate coverage without adding
  signal.
      </script></md>
    </pd-section>

  </pd-tab>

  <pd-tab name="Solution">

    <pd-section id="approach" title="Approach">
      <md><script type="text/plain">
Two small changes:

**1. `cli/add.go` — change flag type**

Replace `StringArrayVar` with `StringSliceVar` for `--skill`. Cobra's `StringSliceVar`
parses each value as CSV, so `--skill a,b` splits to `["a", "b"]` and
`--skill a --skill b` produces `["a", "b"]` — identical result either way.
Update the flag description to say "comma-separated or repeatable".

This is consistent with `auto-etl`'s `--only` flag (also `StringSliceVar`), making
the two projects' list-flag behaviour uniform.

**2. `add/add.go` — improve not-found error message**

The existing message is:
```
skill(s) not found: a,b; available: X, Y, Z
```
Replace with a two-line format:
```
skill(s) not found: a; available: X, Y, Z
hint: use --skill X --skill Y to install multiple skills
```
The hint is appended only when the available list is non-empty (it always is in
the not-found branch, since we checked discovered is non-empty above). This
surfaces the repeatable form in the one place users are most likely to read
when something goes wrong.
      </script></md>
    </pd-section>

- **Fail loudly with a hint (no acceptance of commas)**: the task asked us to choose;
  accepting commas is strictly more friendly and requires no extra code path.
- **Change `--path` and `sync --target` at the same time**: no user pain reported there;

func TestAddSkillCommaFilter(t *testing.T) {
    fixture := makeAddFixture(t, map[string]string{
        "skills/alpha": addSkillMD("alpha", "Use when testing alpha."),
        "skills/beta":  addSkillMD("beta", "Use when testing beta."),
    })
    root := t.TempDir()

    // comma-separated installs both skills
    stdout, _, code := runCLI(t, "--root", root, "add", fixture, "--skill", "alpha,beta", "--text")
    if code != 0 {
        t.Fatal("expected success for comma-separated --skill filter")
    }
    if !strings.Contains(stdout, "alpha") {
        t.Errorf("expected 'alpha' in output, got: %s", stdout)
    }
    if !strings.Contains(stdout, "beta") {
        t.Errorf("expected 'beta' in output, got: %s", stdout)
    }
}

func TestAddSkillCommaFilterPartialMiss(t *testing.T) {
    fixture := makeAddFixture(t, map[string]string{
        "skills/alpha": addSkillMD("alpha", "Use when testing alpha."),
    })
    root := t.TempDir()

    _, stderr, code := runCLI(t, "--root", root, "add", fixture, "--skill", "alpha,missing")
    if code == 0 {
        t.Fatal("expected error when one comma-separated skill is not found")
    }
    if !strings.Contains(stderr, "missing") {
        t.Fatalf("expected not-found name 'missing' in error, got: %s", stderr)
    }
    if !strings.Contains(stderr, "alpha") {
        t.Fatalf("expected available skill 'alpha' in error, got: %s", stderr)
    }
    if !strings.Contains(stderr, "--skill") {
        t.Fatalf("expected '--skill' hint in error, got: %s", stderr)
    }
}
```
